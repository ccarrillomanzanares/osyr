# OSYR — destination for 'osyr-diag' (uploads a .tar.gz with the computer's logs).
# The token is kept separately, in /etc/osyr/diag.token: post-build.sh copies it
# from local/diag.token in the tree (outside git). Without a token, osyr-diag only
# saves the bundle in /tmp.
URL=https://ccmai.org/osyr-diag/upload
# Conversations with the assistant in the report: ask (default: osyr-diag shows
# them and asks, default no; without a terminal, no), yes or no. Each user can
# change it in ~/.config/osyr/diag.conf, or just once with 'osyr-diag --chats'
# or '/report chats' in the chat. The last 5 from the last 7 days are sent
# (up to 2 MB), and osyr-diag always says so.
SEND_CHATS=ask

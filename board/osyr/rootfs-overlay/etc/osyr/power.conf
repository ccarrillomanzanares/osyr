# OSYR — automatic power profile (osyr-power.service, osyr sys power).
# On battery: CPU in power saving, lower brightness and fewer model threads. When
# plugged in, everything goes back. After editing: sudo osyr sys power apply --force

# yes / no
ENABLED=yes

# Maximum brightness on battery, in % (if higher, it drops to this; restored when plugged in)
BATTERY_BRIGHTNESS=60

# Model threads on battery: auto = half the cores; a number; or keep to leave
# them alone. Changing them restarts the model (only when it is not answering).
BATTERY_LLAMA_THREADS=auto

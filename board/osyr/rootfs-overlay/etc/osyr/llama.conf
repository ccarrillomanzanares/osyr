# OSYR — local model served by llama-server (osyr-llama.service).
# After editing: sudo systemctl restart osyr-llama

# Model and vision projector, in /usr/share/osyr/models. Empty = autodetect
# (the first .gguf that is not an mmproj, and whatever mmproj there is).
MODEL=Qwen3.5-4B-Q4_K_M.gguf
MMPROJ=Qwen3.5-4B-mmproj-F16.gguf

# Vision (/look): "ondemand" = a second server that starts when vision is used and
# stops after 10 min idle (less RAM, and the fixed prompt saved on disk);
# "always" = the projector always loaded in the agent's server.
VISION=ondemand

# Local only: the agent and the interface talk to 127.0.0.1.
HOST=127.0.0.1
PORT=8083

# Context in tokens. "auto": what fits in RAM, capped for speed
# (16K on the minimum 8 GB profile, 32K with 12 GB or more). Or a fixed number.
CTX=auto

# Threads when generating: "auto" = physical cores. Generation is limited by memory
# speed, not the CPU: more threads (SMT) are rarely faster and sometimes slower.
THREADS=auto
# Threads when reading the prompt (the wait before it starts answering):
# "auto" = all threads but one.
THREADS_BATCH=auto

# Extra options for llama-server, passed as is.
EXTRA_ARGS=

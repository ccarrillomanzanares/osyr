# OSYR — source for 'osyr update code' (scripts and configuration from git).
REPO=https://github.com/ccarrillomanzanares/osyr
BRANCH=main
# release: only versions (v* tags) signed with a key from
#          /etc/osyr/update-signers. The safe choice, and the default.
# main:    the latest on the branch, UNSIGNED. Development only.
CHANNEL=release
# Whole version (only OSYR installed on disk): osyr.img.xz and its signed
# manifest (.manifest and .manifest.sig) at this address. 'osyr update image'.
IMAGE_URL=https://ccmai.org/osyr/releases/osyr.img.xz
# Daily check (osyr-update-check.timer) with a desktop notice, once per
# version. It never installs anything by itself. no = no check.
AUTO_CHECK=yes

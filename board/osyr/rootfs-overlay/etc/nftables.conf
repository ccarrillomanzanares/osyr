#!/usr/sbin/nft -f
# OSYR — firewall (osyr-firewall.service). Everything goes out; from outside only
# replies to connections opened from here come in. A table of its own: reloading
# does not touch other rules (containers, VPN).
#
# To open something, add a file in /etc/nftables.d/ and 'sudo systemctl reload osyr-firewall'.
# Example, SSH (/etc/nftables.d/ssh.nft):
#   add rule inet osyr input tcp dport 22 accept

destroy table inet osyr

table inet osyr {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        # IPv6 does not work without ICMPv6 (neighbour discovery, router advertisements)
        meta l4proto ipv6-icmp accept
        meta l4proto icmp accept
        # DHCP: the server's replies (v4 in case they do not go through a packet socket)
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}

include "/etc/nftables.d/*.nft"

# OSYR — console=ttyS0 (for QEMU and the tests) creates a getty on ttyS0 also
# on laptops without a serial port: agetty failed and restarted every 10 s.
# It only starts if the port really exists (type 0 = no UART behind it).
[Service]
ExecCondition=/bin/sh -c 'read t < /sys/class/tty/%I/type && [ "$$t" != 0 ]'

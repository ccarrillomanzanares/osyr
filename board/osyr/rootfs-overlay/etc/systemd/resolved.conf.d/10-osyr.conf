# OSYR — no LLMNR or mDNS: they announced the computer on the local network
# (port 5355 open on every interface) and OSYR does not use them.
[Resolve]
LLMNR=no
MulticastDNS=no
# No DNSSEC validation (like Ubuntu and Fedora): many home routers strip the
# signatures and, until resolved downgrades, names do not resolve (seen on the
# 2014 laptop with ollama.com: ~1 min of "DNSSEC validation failed ... no-signature").
DNSSEC=no

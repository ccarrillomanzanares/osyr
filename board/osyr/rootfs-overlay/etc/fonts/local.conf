<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- OSYR: emoji in colour. Right after the font asked for (only for the
     characters it lacks), before DejaVu Sans, which has a few emoji in black
     and white. Read through conf.d/51-local.conf. -->
<fontconfig>
  <alias binding="weak">
    <family>DejaVu Sans Mono</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>DejaVu Sans</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>DejaVu Serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>

# OSYR — hybrid BIOS + UEFI disk image (osyr.img), inherited from newos.
#   sector 0     GRUB boot.img (446 bytes, leaving the partition table alone)
#   sector 1..   grub.img (GRUB BIOS core) in the gap before partition 1
#   partition 1  EFI (FAT): EFI/BOOT/bootx64.efi, boot/bzImage, boot/grub/grub.cfg
#   partition 2  ext4 root -> root=PARTUUID=a105a105-02

image efi-part.vfat {
	vfat {
		label = "OSYR_EFI"
		file EFI {
			image = "esp/EFI"
		}
		file boot {
			image = "esp/boot"
		}
	}
	size = 64M
}

image osyr.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0xa105a105
	}

	partition mbr-boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition efi {
		partition-type = 0xEF
		bootable = "true"
		image = "efi-part.vfat"
		offset = 1M
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}

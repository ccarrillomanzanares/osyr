# OSYR — GRUB menu (disk image: USB, QEMU, internal disk).
# post-image.sh replaces @ROOT@. Hold Shift while booting to see the menu.
set default="0"
set timeout="0"
set timeout_style="hidden"
terminal_output console

menuentry "OSYR" {
    linux /boot/bzImage root=@ROOT@ rootwait rw \
        console=ttyS0,115200 console=tty1 quiet loglevel=3 vt.global_cursor_default=0
}

menuentry "OSYR (recovery)" {
    linux /boot/bzImage root=@ROOT@ rootwait rw console=ttyS0,115200 console=tty1 loglevel=7 systemd.unit=rescue.target
}

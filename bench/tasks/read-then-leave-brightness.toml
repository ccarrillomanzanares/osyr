id = "read-then-leave-brightness"
category = "multi-step"
level = 1
split = "train"
langs = ["en", "es", "de"]

# The other side of 'read-then-set-brightness': the reading is over the threshold, so the
# right end is that nothing changes, and it says so.
[vars]
now = [{ pct = "70", raw = "700" }, { pct = "75", raw = "750" }, { pct = "85", raw = "850" }, { pct = "95", raw = "950" }]
limit = ["55", "60", "65"]
target = ["80", "90", "100"]

[setup.sysfs]
"class/backlight/intel_backlight/brightness" = "{now.raw}"

[[turns]]
en = ["If the screen brightness is below {limit}%, set it to {target}%. Otherwise leave it.",
      "check the brightness: under {limit} percent, put it at {target}; if not, do nothing",
      "Raise the brightness to {target}% only if it is lower than {limit}% now."]
es = ["Si el brillo de la pantalla está por debajo del {limit}%, ponlo al {target}%. Si no, déjalo.",
      "mira el brillo: si está por debajo del {limit} por ciento, ponlo al {target}; si no, no hagas nada",
      "Sube el brillo al {target}% solo si ahora está por debajo del {limit}%."]
de = ["Wenn die Bildschirmhelligkeit unter {limit}% liegt, stelle sie auf {target}%. Sonst lass sie.",
      "prüf die Helligkeit: unter {limit} Prozent auf {target} stellen; wenn nicht, nichts tun",
      "Erhöhe die Helligkeit auf {target}%, aber nur wenn sie jetzt unter {limit}% liegt."]
confirm = "yes"

[expect]
state = ["unchanged"]
trajectory = ["called osyr ui brightness"]
answer = ["mentions {now.pct}"]
